[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-backbone"
version = "0.1.0"
description = "CIFAR-100 baselines plus small Edge-RecViT and HAMSA backbones."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]
